[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"webapp/main.py" = ["B008"]

[tool.coverage.run]
source = ["webapp"]
omit = ["webapp/templates/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
