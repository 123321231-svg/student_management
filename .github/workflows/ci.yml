name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check webapp desktop_launcher.py test_database.py test_webapp.py test_launcher.py test_orm.py test_services.py
      - run: coverage run -m unittest -v test_database.py test_webapp.py test_launcher.py test_orm.py test_services.py
      - run: coverage report
