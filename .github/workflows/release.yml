name: Build Windows Release

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest -v test_database.py test_webapp.py test_launcher.py test_orm.py test_services.py
      - run: pyinstaller --noconfirm student_management.spec
      - shell: pwsh
        run: Compress-Archive -Path dist/StudentAnalytics.exe,README.md,LICENSE -DestinationPath StudentAnalytics-${{ github.ref_name }}-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: StudentAnalytics-${{ github.ref_name }}-windows.zip
