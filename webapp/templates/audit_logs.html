{% extends "base.html" %}
{% block content %}
<div class="page-title">
  <div>
    <h1>审计日志</h1>
    <p class="muted">最近 200 条关键操作，用于问题追踪和权限审计。</p>
  </div>
</div>
<div class="card table-card">
  {% if logs %}
  <div class="table-wrap">
    <table>
      <thead><tr><th>时间</th><th>操作人</th><th>动作</th><th>详情</th></tr></thead>
      <tbody>
      {% for log in logs %}
        <tr>
          <td>{{ log['created_at'] }}</td>
          <td>{{ log['full_name'] or '系统' }}</td>
          <td><span class="role">{{ log['action'] }}</span></td>
          <td>{{ log['detail'] or '-' }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <div class="empty-state">暂无审计记录</div>
  {% endif %}
</div>
{% endblock %}
