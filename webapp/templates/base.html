<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or '学生信息管理系统' }}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --blue:#4f46e5; --blue-dark:#3730a3; --ink:#111827; --muted:#64748b; --bg:#f4f7fb; --card:#fff; --line:#e2e8f0; --danger:#dc2626; --sidebar:#111827; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    a { color:inherit; text-decoration:none; }
    .topbar { height:68px; background:var(--sidebar); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 30px; box-shadow:0 1px 0 rgba(255,255,255,.08); }
    .brand { font-size:19px; font-weight:800; letter-spacing:.02em; }
    .topbar a { color:#dbeafe; margin-left:18px; font-size:14px; }
    .layout { display:flex; min-height:calc(100vh - 64px); }
    .sidebar { width:232px; background:#fff; border-right:1px solid var(--line); padding:26px 16px; }
    .nav-title { color:#94a3b8; font-size:11px; font-weight:700; letter-spacing:.12em; padding:0 14px 12px; }
    .nav-link { display:block; padding:12px 14px; border-radius:10px; margin-bottom:5px; color:#334155; font-weight:600; font-size:14px; }
    .nav-link:hover, .nav-link.active { background:#eef2ff; color:var(--blue); transform:translateX(2px); }
    .content { flex:1; padding:32px; max-width:1500px; margin:0 auto; width:100%; }
    .page-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
    h1 { margin:0; font-size:26px; } h2 { font-size:18px; margin:0 0 14px; }
    .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:0 8px 24px rgba(15,23,42,.045); }
    .hero { background:linear-gradient(135deg,#111827,#312e81); color:#fff; border-radius:20px; padding:28px 30px; box-shadow:0 16px 34px rgba(49,46,129,.2); }
    .hero .muted { color:#cbd5e1; } .hero h1 { margin-top:6px; }
    .eyebrow { color:#a5b4fc; font-size:11px; font-weight:800; letter-spacing:.18em; }
    .metric-label { color:var(--muted); font-size:13px; font-weight:600; } .metric-value { font-size:32px; font-weight:800; margin-top:10px; letter-spacing:-.03em; } .metric-value small { font-size:15px; margin-left:2px; color:var(--muted); }
    .metric-note { margin-top:5px; color:#94a3b8; font-size:12px; }
    .metric-card { position:relative; overflow:hidden; } .metric-card:after { content:""; position:absolute; width:70px; height:70px; border-radius:50%; right:-24px; top:-24px; background:#eef2ff; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    input, select { border:1px solid #d0d5dd; border-radius:8px; padding:10px 12px; font-size:14px; background:#fff; }
    input:focus, select:focus { outline:2px solid #c7d7fe; border-color:var(--blue); }
    button, .btn { border:0; border-radius:8px; background:var(--blue); color:#fff; padding:10px 15px; cursor:pointer; font-size:14px; display:inline-block; }
    button.secondary, .btn.secondary { background:#eef2f6; color:#344054; } button.danger { background:var(--danger); }
    table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:13px 12px; border-bottom:1px solid var(--line); font-size:14px; } th { color:var(--muted); font-weight:700; background:#f8fafc; font-size:12px; letter-spacing:.03em; } tbody tr:hover { background:#fafbff; }
    .table-wrap { overflow:auto; } .empty-state { padding:50px 20px; text-align:center; color:var(--muted); }
    .feature-list { display:grid; gap:12px; margin-top:18px; } .feature-list div { padding:14px; border-radius:12px; background:#f8fafc; border:1px solid #eef2f7; } .feature-list strong,.feature-list span { display:block; } .feature-list span { color:var(--muted); font-size:13px; margin-top:5px; }
    .inline-form { display:flex; gap:7px; align-items:center; flex-wrap:wrap; } .message { background:#ecfdf3; color:#027a48; border:1px solid #abefc6; padding:12px 14px; border-radius:8px; margin-bottom:16px; }
    .error { background:#fef3f2; color:#b42318; border:1px solid #fecdca; padding:12px 14px; border-radius:8px; margin-bottom:16px; }
    .auth-shell { min-height:100vh; display:grid; place-items:center; padding:20px; } .auth-card { width:min(420px,100%); background:#fff; padding:32px; border-radius:16px; box-shadow:0 12px 40px rgba(16,24,40,.1); }
    .auth-card h1 { margin-bottom:8px; } .auth-card p { color:var(--muted); margin-top:0; } .field { margin:15px 0; } .field label { display:block; margin-bottom:6px; font-size:14px; } .field input { width:100%; }
    .muted { color:var(--muted); } .role { border-radius:999px; padding:4px 9px; font-size:12px; background:#eef2ff; color:#3730a3; font-weight:700; }
    @media(max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .two-col { grid-template-columns:1fr; } .sidebar { width:180px; } }
    @media(max-width:640px) { .layout { display:block; } .sidebar { width:auto; border-right:0; border-bottom:1px solid var(--line); } .content { padding:18px; } .grid { grid-template-columns:1fr 1fr; } .topbar { padding:0 16px; } .topbar a { margin-left:8px; } }
  </style>
</head>
<body>
{% if user %}
<header class="topbar"><div class="brand">学生信息管理系统</div><div>{{ user['full_name'] }} · {{ user['role'] }} <a href="/logout">退出登录</a></div></header>
<div class="layout"><aside class="sidebar"><div class="nav-title">系统菜单</div><a class="nav-link" href="/dashboard">仪表盘</a><a class="nav-link" href="/students">学生管理</a><a class="nav-link" href="/academics">教务数据</a><a class="nav-link" href="/analytics">分析中心</a>{% if user['role'] == 'admin' %}<a class="nav-link" href="/users">用户与权限</a><a class="nav-link" href="/audit-logs">审计日志</a>{% endif %}</aside><main class="content">
{% if message %}<div class="message">{{ message }}</div>{% endif %}
{% block content %}{% endblock %}
</main></div>
{% else %}{% block auth_content %}{% endblock %}{% endif %}
</body>
</html>
