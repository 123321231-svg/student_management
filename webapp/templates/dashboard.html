{% extends "base.html" %}
{% block content %}<div class="page-title"><div><h1>仪表盘</h1><p class="muted">学生信息、成绩统计和系统概览</p></div><a class="btn" href="/students">进入学生管理</a></div><div class="grid"><div class="card"><div class="metric-label">学生总数</div><div class="metric-value" id="count">-</div></div><div class="card"><div class="metric-label">平均成绩</div><div class="metric-value" id="average">-</div></div><div class="card"><div class="metric-label">最高成绩</div><div class="metric-value" id="highest">-</div></div><div class="card"><div class="metric-label">最低成绩</div><div class="metric-value" id="lowest">-</div></div></div><div class="two-col"><div class="card"><h2>成绩分布</h2><canvas id="scoreChart" height="220"></canvas></div><div class="card"><h2>系统说明</h2><p class="muted">系统支持学生信息搜索、增删改查、成绩统计、图表展示、Excel 导入导出，以及管理员、教师、查看者三种角色权限。</p><p class="muted">新注册用户默认是查看者，管理员可以在“用户与权限”中调整角色。</p></div></div><script>fetch('/api/stats').then(r=>r.json()).then(d=>{['count','average','highest','lowest'].forEach(k=>document.getElementById(k).textContent=d[k]);new Chart(document.getElementById('scoreChart'),{type:'bar',data:{labels:['不及格','及格','良好','优秀'],datasets:[{label:'学生人数',data:d.bands,backgroundColor:['#f97066','#fdb022','#53b1fd','#12b76a'],borderRadius:8}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});});</script>{% endblock %}
