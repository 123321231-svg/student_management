{% extends "base.html" %}
{% block auth_content %}<div class="auth-shell"><div class="auth-card"><h1>注册账号</h1><p>注册后默认拥有查看权限</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label>用户名</label><input name="username" required minlength="3"></div><div class="field"><label>姓名</label><input name="full_name" required></div><div class="field"><label>密码</label><input type="password" name="password" required minlength="6"></div><div class="field"><label>确认密码</label><input type="password" name="confirm_password" required minlength="6"></div><button type="submit" style="width:100%">注册</button></form><p style="margin-top:18px;text-align:center"><a href="/login" style="color:#2563eb">返回登录</a></p></div></div>{% endblock %}
