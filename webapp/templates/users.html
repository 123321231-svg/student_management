{% extends "base.html" %}
{% block content %}<div class="page-title"><div><h1>用户与权限</h1><p class="muted">管理员可以调整用户角色</p></div></div><div class="card"><table><thead><tr><th>用户名</th><th>姓名</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>{% for item in users %}<tr><td>{{ item['username'] }}</td><td>{{ item['full_name'] }}</td><td><span class="role">{{ item['role'] }}</span></td><td>{{ '正常' if item['is_active'] else '停用' }}</td><td>{{ item['created_at'] }}</td><td><form class="inline-form" method="post" action="/users/{{ item['id'] }}/role"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><select name="role"><option value="viewer" {% if item['role']=='viewer' %}selected{% endif %}>查看者</option><option value="teacher" {% if item['role']=='teacher' %}selected{% endif %}>教师</option><option value="admin" {% if item['role']=='admin' %}selected{% endif %}>管理员</option></select><button type="submit">保存</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
