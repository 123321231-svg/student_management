{% extends "base.html" %}
{% block auth_content %}<div class="auth-shell"><div class="auth-card"><h1>学生信息管理系统</h1><p>安全登录管理平台</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label>用户名</label><input name="username" required autocomplete="username"></div><div class="field"><label>密码</label><input type="password" name="password" required autocomplete="current-password"></div><button type="submit" style="width:100%">登录</button></form><p style="margin-top:18px;text-align:center"><a href="/register" style="color:#2563eb">注册新账号</a></p><p class="muted" style="font-size:12px">初始管理员账号：admin，初始密码：admin123。部署公网前请修改。</p></div></div>{% endblock %}
